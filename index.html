<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>物体360环视展示</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box}
body{background:#eeeeee;height:100vh;display:flex;flex‑direction:column;align‑items:center;justify‑content:center;font‑family:sans‑serif;overflow:hidden;}
#viewer{
  width:90vw;
  max‑width:700px;
  height:500px;
  background:#ffffff;
  background‑image:url('./0_0.png');
  background‑repeat:no‑repeat;
  background‑position:center;
  background‑size:contain;
  touch‑action:none;
  user‑select:none;
}
.controls{margin‑top:16px;display:flex;gap:10px}
button{padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<div id="viewer"></div>
<div class="controls">
  <button id="autoBtn">自动播放</button>
  <button id="resetBtn">重置</button>
</div>

<script>
// 你的序列配置：0_0.png ~0_17.png，总帧数18
const totalFrames = 18;
let currentFrame = 0;
let autoPlay = false;
const viewerDom = document.getElementById('viewer');

// 设置背景图片
function setFrame(idx){
  idx = idx % totalFrames;
  if(idx<0) idx += totalFrames;
  currentFrame = idx;
  viewerDom.style.backgroundImage = `url('./0_${currentFrame}.png')`;
}
setFrame(0);

//拖拽变量
let isDown = false;
let startX;
let dragDelta=0;

viewerDom.addEventListener('mousedown',(e)=>{
  isDown=true;startX=e.pageX;viewerDom.style.cursor='grabbing';
})
window.addEventListener('mouseup',()=>{isDown=false;viewerDom.style.cursor='grab';})
window.addEventListener('mousemove',(e)=>{
  if(!isDown) return;
  const dx = e.pageX‑startX;
  startX = e.pageX;
  dragDelta += dx;
  //每30像素移动切换一帧
  if(Math.abs(dragDelta)>30){
    const step = dragDelta>0 ? 1 :‑1;
    setFrame(currentFrame + step);
    dragDelta=0;
  }
})

//触屏支持
viewerDom.addEventListener('touchstart',e=>{
  isDown=true;startX=e.touches[0].pageX;
},{passive:true})
viewerDom.addEventListener('touchend',()=>isDown=false,{passive:true})
viewerDom.addEventListener('touchmove',e=>{
  if(!isDown) return;
  const dx = e.touches[0].pageX‑startX;
  startX=e.touches[0].pageX;
  dragDelta += dx;
  if(Math.abs(dragDelta)>25){
    const step = dragDelta>0?1:‑1;
    setFrame(currentFrame+step);
    dragDelta=0;
  }
},{passive:true})

//按钮逻辑
const autoBtn=document.getElementById("autoBtn");
const resetBtn=document.getElementById("resetBtn");
let autoTimer=null;
autoBtn.onclick=()=>{
  autoPlay=!autoPlay;
  if(autoPlay){
    autoBtn.innerText="停止";
    autoTimer=setInterval(()=>setFrame(currentFrame+1),120);
  }else{
    autoBtn.innerText="自动播放";
    clearInterval(autoTimer);
  }
}
resetBtn.onclick=()=>{
  clearInterval(autoTimer);
  autoPlay=false;autoBtn.innerText="自动播放";
  setFrame(0);
}
</script>
</body>
</html>
